<script type="text/javascript">
(function() {
    const common = {
        category: 'Azure IoT Edge',
        color: '#d9e8f5',
        align: 'right'
    };

    RED.nodes.registerType('moduleinput-amqp', {
        ...common,
        defaults: {
            name: { value: '' },
            input: { value: 'input1', required: true }
        },
        inputs: 0,
        outputs: 1,
        icon: 'font-awesome/fa-sign-in',
        paletteLabel: 'Module Input (AMQP)',
        label: function() { return this.name || `Module Input: ${this.input}`; }
    });

    RED.nodes.registerType('moduleoutput-amqp', {
        ...common,
        defaults: {
            name: { value: '' },
            output: { value: 'output1', required: true }
        },
        inputs: 1,
        outputs: 1,
        icon: 'font-awesome/fa-sign-out',
        paletteLabel: 'Module Output (AMQP)',
        label: function() { return this.name || `Module Output: ${this.output}`; }
    });

    RED.nodes.registerType('moduletwin-amqp', {
        ...common,
        defaults: { name: { value: '' } },
        inputs: 1,
        outputs: 1,
        icon: 'font-awesome/fa-exchange',
        paletteLabel: 'Module Twin (AMQP)',
        label: function() { return this.name || 'Module Twin (AMQP)'; }
    });

    RED.nodes.registerType('modulemethod-amqp', {
        ...common,
        defaults: {
            name: { value: '' },
            method: { value: 'method1', required: true }
        },
        inputs: 1,
        outputs: 1,
        icon: 'font-awesome/fa-code',
        paletteLabel: 'Module Method (AMQP)',
        label: function() { return this.name || `Module Method: ${this.method}`; }
    });
})();
</script>

<script type="text/x-red" data-template-name="moduleinput-amqp">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="From EdgeHub">
    </div>
    <div class="form-row">
        <label for="node-input-input"><i class="fa fa-sign-in"></i> Input</label>
        <input type="text" id="node-input-input" placeholder="SimulatedTemperatureSensor">
    </div>
</script>

<script type="text/x-red" data-help-name="moduleinput-amqp">
    <p>Receives messages from a named EdgeHub module input.</p>
    <p>All AMQP nodes share one resilient EdgeHub connection automatically.</p>
    <p>JSON payloads are parsed into objects; non-JSON payloads remain strings.</p>
</script>

<script type="text/x-red" data-template-name="moduleoutput-amqp">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="ToHub">
    </div>
    <div class="form-row">
        <label for="node-input-output"><i class="fa fa-sign-out"></i> Output</label>
        <input type="text" id="node-input-output" placeholder="output1">
    </div>
</script>

<script type="text/x-red" data-help-name="moduleoutput-amqp">
    <p>Sends <code>msg.payload</code> to the named EdgeHub module output.</p>
    <p>Objects are serialized as JSON; strings and buffers retain their content.</p>
</script>

<script type="text/x-red" data-template-name="moduletwin-amqp">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Module Twin">
    </div>
</script>

<script type="text/x-red" data-help-name="moduletwin-amqp">
    <p>Receives desired-property updates and sends <code>msg.payload</code> as reported properties.</p>
</script>

<script type="text/x-red" data-template-name="modulemethod-amqp">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Method Handler">
    </div>
    <div class="form-row">
        <label for="node-input-method"><i class="fa fa-code"></i> Method</label>
        <input type="text" id="node-input-method" placeholder="method1">
    </div>
</script>

<script type="text/x-red" data-help-name="modulemethod-amqp">
    <p>Handles a direct method and exposes the request as a Node-RED message.</p>
    <p>The next message sent into this node is used as the method response.</p>
</script>
